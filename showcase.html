---
layout: default
title : Gallery
navbar_title: Gallery
container_class: container-xl
---

{% assign cards = site.showcase | sort: "date" | reverse | where: "show", true %}

<div class="row">
    {% for item in cards %}
    <div class="col-lg-4 col-md-6 p-2">
        <div class="card border-0 shadow-sm bg-white">
            <h5 class="card-header bg-white border-bottom pl-3 pt-3 pb-2">{{ item.group }}</h5>
            {{ item.content }}
        </div>
    </div>
    {% endfor %}
</div>
