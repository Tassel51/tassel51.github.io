short_bio_text_justify: true
short_bio: >-
  <p>
    I am <strong>Zichen Zhu (朱子琛)</strong>, a Ph.D. student at the
    <a href="https://ai.zju.edu.cn/" target="_blank">College of Artificial Intelligence</a>,
    <a href="https://www.zju.edu.cn/" target="_blank">Zhejiang University, China</a>,
    supervised by <a href="https://sites.google.com/view/wenguanwang" target="_blank">Prof. Wenguan Wang</a>,
    expected to start in <strong>September 2027</strong>.
  </p>
  <p>
    I received my B.E. degree in <strong>Communication Engineering</strong> from the
    School of <a href="http://www.cse.neu.edu.cn/" target="_blank">Computer Science and Engineering</a>,
    <a href="https://www.neu.edu.cn/" target="_blank">Northeastern University, China</a>.
  </p>

  <h6 class="mt-4">🔬 Research</h6>
  <div class="research-vision">
    <div class="research-vision-label">Research Vision</div>
    <div class="research-vision-q">How can intelligent agents learn to predict the consequences of their actions and make reliable decisions in a dynamic physical world?</div>
  </div>

  <p class="mt-3 mb-2">
    My research interests lie in <strong class="kw">Generative World Models for Embodied Intelligence</strong>.
    I am particularly interested in learning predictive and controllable representations of the physical world,
    bridging visual generation, physical understanding, and action-oriented decision-making.
  </p>
  <div class="research-chips">
    <span class="chip chip-pink">World Models</span>
    <span class="chip chip-purple">Embodied Intelligence</span>
    <span class="chip chip-blue">AI Agents</span>
    <span class="chip chip-teal">Spatial Intelligence</span>
    <span class="chip chip-orange">Vision-Language-Action (VLA) Models</span>
    <span class="chip chip-indigo">Model-based Planning &amp; Learning</span>
  </div>

