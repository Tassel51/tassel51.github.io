short_bio: >-
  <p>
    I am an undergraduate student majoring in <strong>Communication Engineering</strong> at the
    School of <a href="http://www.cse.neu.edu.cn/" target="_blank">Computer Science and Engineering</a>,
    <a href="https://www.neu.edu.cn/" target="_blank">Northeastern University, China</a>.
  </p>
  <p>
    My academic journey is driven by a strong interest in bridging theoretical knowledge with practical
    innovation in modern communication technologies, as well as a profound curiosity for developing,
    applying, and integrating modern artificial intelligence (AI)-related technologies with my academic discipline.
  </p>
  <p>
    I am expected to complete my undergraduate studies by <strong>June 2027</strong> and am actively seeking
    opportunities for master's or Ph.D. programs.
  </p>

  <h6 class="mt-4"><i class="fas fa-lightbulb"></i> Research Interests</h6>
  <ul>
    <li><strong>Internet of Everything:</strong> Interconnection of devices, systems, and services beyond traditional machine-to-machine communication.</li>
    <li><strong>Embodied Intelligence:</strong> Integrating AI with physical systems for real-world interaction and learning.</li>
    <li><strong>Multimodal Large Language Models:</strong> Extending LLMs to process and understand multiple data modalities.</li>
    <li><strong>Vision-Language-Action Models:</strong> Bridging visual perception, language understanding, and robotic action.</li>
    <li><strong>Object Detection and Recognition:</strong> Computer vision techniques for identifying and localizing objects in complex scenes.</li>
  </ul>

  <h6 class="mt-3"><i class="fas fa-rocket"></i> Projects</h6>
  <ul>
    <li><a href="https://github.com/Tassel51/Smart-Campus-Life-Assistant.git" target="_blank"><strong>Smart Campus Life Assistant</strong></a> — A comprehensive NEU campus service visualization system built on data structure theory.</li>
    <li><a href="https://tassel51.github.io/blogs/robot.md" target="_blank"><strong>"Lingxi" — Multimodal Dual-Arm Mobile Robot</strong></a> — An embodied intelligence platform integrating vision, language, and manipulation.</li>
    <li><a href="https://github.com/Tassel51/Language-Modeling-from-Scratch-by-Tassel51" target="_blank"><strong>Language Modeling from Scratch</strong></a> — Building a transformer architecture from the ground up, inspired by Stanford CS336.</li>
  </ul>

