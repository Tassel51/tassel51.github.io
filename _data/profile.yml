short_bio: >-
  <p>
    I am <strong>Zichen Zhu (朱子琛)</strong>, an undergraduate student majoring in <strong>Communication Engineering</strong> at the
    School of <a href="http://www.cse.neu.edu.cn/" target="_blank">Computer Science and Engineering</a>,
    <a href="https://www.neu.edu.cn/" target="_blank">Northeastern University, China</a>.
  </p>
  <p>
    My academic journey is driven by a strong interest in bridging theoretical knowledge with practical
    innovation in modern communication technologies, as well as a profound curiosity for developing,
    applying, and integrating modern artificial intelligence (AI)-related technologies with my academic discipline.
  </p>
  <p>
    I am expected to complete my undergraduate studies by <strong>June 2027</strong> and am actively seeking
    opportunities for master's or Ph.D. programs.
  </p>

  <h6 class="mt-4">🌱 Research Interests</h6>
  <p>
    <a href="https://en.wikipedia.org/wiki/Internet_of_things" target="_blank"><span class="badge badge-light mr-1 mb-1">Internet of Everything</span></a>
    <a href="https://en.wikipedia.org/wiki/Embodied_cognition" target="_blank"><span class="badge badge-light mr-1 mb-1">Embodied Intelligence</span></a>
    <a href="https://en.wikipedia.org/wiki/Multimodal_learning" target="_blank"><span class="badge badge-light mr-1 mb-1">Multimodal Large Language Models</span></a>
    <a href="https://en.wikipedia.org/wiki/Model_compression" target="_blank"><span class="badge badge-light mr-1 mb-1">Model Compression & Quantization</span></a>
  </p>

  <h6 class="mt-3">🛠️ Projects</h6>
  <ul class="small text-muted pl-3 mb-0">
    <li class="mb-1"><a href="https://github.com/Tassel51/Smart-Campus-Life-Assistant.git" target="_blank"><strong>Smart Campus Life Assistant</strong></a> — A comprehensive NEU campus service visualization system built on data structure theory.</li>
    <li class="mb-1"><a href="https://tassel51.github.io/blogs/robot.md" target="_blank"><strong>"Lingxi" — Multimodal Dual-Arm Mobile Robot</strong></a> — An embodied intelligence platform integrating vision, language, and manipulation.</li>
    <li class="mb-1"><a href="https://github.com/Tassel51/Language-Modeling-from-Scratch-by-Tassel51" target="_blank"><strong>Language Modeling from Scratch</strong></a> — Building a transformer architecture from the ground up, inspired by Stanford CS336.</li>
  </ul>

