short_bio: >-
  <p>
    我是 <strong>朱子琛（Zichen Zhu）</strong>，<a href="https://www.zju.edu.cn/" target="_blank">浙江大学</a>
    <a href="https://ai.zju.edu.cn/" target="_blank">人工智能学院</a>直博研究生，
    师从<a href="https://sites.google.com/view/wenguanwang" target="_blank">王文冠教授</a>，
    预计 <strong>2027年9月</strong> 入学。
  </p>
  <p>
    本科毕业于
    <a href="https://www.neu.edu.cn/" target="_blank">东北大学</a>
    <a href="http://www.cse.neu.edu.cn/" target="_blank">计算机科学与工程学院</a>，
    <strong>通信工程</strong>专业。
  </p>

  <h6 class="mt-4">🔬 研究方向</h6>
  <div class="research-vision">
    <div class="research-vision-label">研究愿景</div>
    <div class="research-vision-q">智能体如何学会预测自身行为的后果，并在动态变化的物理世界中做出可靠的决策？</div>
  </div>

  <p class="mt-3 mb-2">
    我的研究兴趣集中在<strong class="kw">面向具身智能的生成式世界模型</strong>。
    我尤其关注学习物理世界中可预测、可控的表示，打通视觉生成、物理理解与面向动作的决策。
  </p>
  <div class="research-chips">
    <span class="chip chip-pink">世界模型</span>
    <span class="chip chip-purple">具身智能</span>
    <span class="chip chip-blue">AI 智能体</span>
    <span class="chip chip-teal">空间智能</span>
    <span class="chip chip-orange">视觉–语言–动作（VLA）模型</span>
    <span class="chip chip-indigo">基于模型的规划与学习</span>
  </div>

