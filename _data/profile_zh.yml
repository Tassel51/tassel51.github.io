short_bio: >-
  <p>
    我是 <strong>朱子琛（Zichen Zhu）</strong>，就读于
    <a href="https://www.neu.edu.cn/" target="_blank">东北大学</a>
    <a href="http://www.cse.neu.edu.cn/" target="_blank">计算机科学与工程学院</a>，
    <strong>通信工程</strong>专业本科生。
  </p>
  <p>
    我的学术兴趣在于将通信技术的理论知识与实践创新相结合，同时对人工智能（AI）相关技术在
    通信领域的开发、应用与整合怀有强烈的好奇心。本科阶段，我的主要研究方向聚焦于<strong>机器人算法开发
    与软硬件部署（具身智能）</strong>、<strong>大语言模型</strong>以及<strong>算法轻量化部署</strong>等方向的探索与实践。
  </p>
  <p>
    预计于 <strong>2027年6月</strong> 完成本科学业，正在积极寻求硕士或博士深造机会。
  </p>

  <h6 class="mt-4">🌱 研究方向</h6>
  <p>
    <a href="https://en.wikipedia.org/wiki/Internet_of_things" target="_blank"><span class="badge badge-light mr-1 mb-1">万物互联</span></a>
    <a href="https://en.wikipedia.org/wiki/Embodied_cognition" target="_blank"><span class="badge badge-light mr-1 mb-1">具身智能</span></a>
    <a href="https://en.wikipedia.org/wiki/Multimodal_learning" target="_blank"><span class="badge badge-light mr-1 mb-1">多模态大语言模型</span></a>
    <a href="https://en.wikipedia.org/wiki/Model_compression" target="_blank"><span class="badge badge-light mr-1 mb-1">模型压缩与量化</span></a>
  </p>

  <h6 class="mt-3">🛠️ 项目</h6>
  <ul class="small text-muted pl-3 mb-0">
    <li class="mb-1"><a href="https://github.com/Tassel51/Smart-Campus-Life-Assistant.git" target="_blank"><strong>Smart Campus Life Assistant</strong></a> — 基于数据结构理论的东北大学校园服务可视化系统</li>
    <li class="mb-1"><a href="https://github.com/Tassel51/LingXi-MultiModal_DualArm_MobileBot" target="_blank"><strong>"灵犀" — 多模态双臂移动机器人</strong></a> — 融合视觉、语言与操作能力的具身智能平台（国家级大学生创新创业训练计划，国家级良好）</li>
    <li class="mb-1"><a href="https://github.com/Tassel51/Language-Modeling-from-Scratch-by-Tassel51" target="_blank"><strong>Language Modeling from Scratch</strong></a> — 从零构建Transformer架构语言模型，参考<a href="https://web.stanford.edu/class/cs336/" target="_blank">斯坦福大学的CS336课程</a></li>
  </ul>

